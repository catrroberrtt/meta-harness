# Señales del negocio -> módulos del ERP. Datos EDITABLES, sin código y sin modelo de lenguaje.
# Cómo se lee (docs/OPCION-ERP.md): cada término cuenta `peso` puntos por archivo, hasta `max_por_termino_y_archivo`
# coincidencias del mismo término en el mismo archivo; los puntos de una señal se suman entre archivos. Si la suma llega al
# umbral, los módulos de la señal entran a la propuesta con su evidencia (archivo, línea, fragmento).
# Los términos van en minúsculas y SIN tildes (la lectura también quita las tildes del texto). Se busca palabra completa
# y se admite plural simple («proveedor» encuentra «proveedores»). Peso: 3 = específico del módulo, 2 = habitual, 1 = genérico.
# Los ids de módulo son los de modulos/catalogo.json del ERP; un id que no exista en el catálogo leído se avisa y se ignora.
# Sin señal a propósito: `suministros` (reporte para la industria de suministros), demasiado ambiguo como palabra clave.
# Sin datos de ninguna empresa: son palabras del oficio, no nombres propios.

version = 1

[umbrales]
senal = 3
rubro = 5
max_por_termino_y_archivo = 3
evidencia_max = 3
fragmento_max = 140

# ---------------------------------------------------------------- rubros (eligen el producto de partida del catálogo)
[rubro.comercio]
etiqueta = "Comercio (tiendas, mayoristas, minoristas)"
producto = "comercio"
